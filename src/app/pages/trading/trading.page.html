<section class="flex h-full min-h-0 w-full flex-col bg-background">
  <div class="min-h-0 flex-1">
    <div
      #chartContainer
      class="h-full min-h-[calc(100vh-4rem)] w-full overflow-hidden"
      aria-label="BTC candlestick chart with volume histogram"
    ></div>
  </div>

  @if (loadError) {
    <p
      class="mt-4 rounded-2xl border border-warning/20 bg-warning/10 px-4 py-3 text-sm text-warning"
    >
      Binance data could not be loaded, so the chart is using a typed static BTC sample.
    </p>
  }
</section>
