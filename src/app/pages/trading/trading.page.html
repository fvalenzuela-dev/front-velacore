<section class="relative flex h-full min-h-0 w-full flex-col bg-background">
  <div class="min-h-0 flex-1">
    <div
      #chartContainer
      class="h-full min-h-[calc(100vh-4rem)] w-full overflow-hidden"
      aria-label="Trading candlestick chart with volume histogram"
    ></div>
  </div>

  @if (isChartLoading) {
    <p class="mt-4 rounded-2xl border border-border bg-surface px-4 py-3 text-sm text-muted">
      Loading chart data for {{ selectedAsset.displayName }}…
    </p>
  }

  @if (loadError) {
    <p
      class="mt-4 rounded-2xl border border-warning/20 bg-warning/10 px-4 py-3 text-sm text-warning"
    >
      Market data could not be loaded for {{ selectedAsset.displayName }}. Check that the local
      backend is running at http://localhost:8091 and restart the Angular dev server if needed.
    </p>
  }
</section>
